[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blockchain-simulation"
version = "1.0.0"
description = "Educational blockchain simulation with PoW, PoS and PoA consensus"
requires-python = ">=3.10"
dependencies = [
    "asgiref>=3.7",
    "base58>=2.1.1",
    "cryptography>=41",
    "ecdsa>=0.19",
    "Flask>=3.0",
    "flask-cors>=4.0",
    "Hypercorn>=0.16",
    "ipfshttpclient>=0.7.0,<0.8",
    "psutil>=5.9",
    "RestrictedPython>=7.4",
    "requests>=2.31",
    "websockets>=12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
